name: Daily Decree Renewal Sync

on:
  schedule:
    # 19:00 UTC = 21:00 Cairo time (Cairo is fixed UTC+2, no DST since 2016).
    # Chosen so hospital_decrees_sync.py / request_status_sync.py run for
    # "today" AFTER working hours have ended, with a ~3h buffer before
    # midnight in case the run gets queued/delayed.
    - cron: '0 19 * * *'

  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (write CSVs as workflow artifacts, do not touch Supabase)'
        type: boolean
        default: false

      date_offset_days:
        description: 'Extract queue for TODAY + N days (ignored if "Exact date" is filled in)'
        type: string
        default: '15'

      exact_date:
        description: 'Re-pull one specific day instead (YYYY-MM-DD) — leave blank for normal runs'
        type: string
        default: ''

      backfill_start_date:
        description: 'ONE-TIME BACKFILL: first day (YYYY-MM-DD) to backfill hospital decrees + requests for. Leave blank for normal runs. When set, this run does ONLY the backfill loop below and skips the normal steps.'
        type: string
        default: ''

      backfill_end_date:
        description: 'ONE-TIME BACKFILL: last day (YYYY-MM-DD), inclusive. Required if backfill_start_date is set.'
        type: string
        default: ''

      request_status_lookback_days:
        description: 'request_status_sync.py: re-check request status for the last N days (not just today), so open requests get refreshed instead of freezing at their day-one status.'
        type: string
        default: '15'

      admin_letter_lookback_days:
        description: 'request_status_sync.py: fetch the actual letter response text for any request at an admin-letter status (خطاب ادارى) within the last N days.'
        type: string
        default: '10'

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 openpyxl pandas

      # -----------------------------------------------------------------
      # Existing job: queue -> decrees -> dispensed items, TODAY + offset
      # (offset default now 15, was 25). Skipped entirely during a backfill
      # run -- backfill only concerns hospital decrees + requests.
      # -----------------------------------------------------------------
      - name: Run daily sync (queue + decrees + dispensed items)
        if: ${{ github.event.inputs.backfill_start_date == '' }}
        env:
          SMC_USERNAME: ${{ secrets.SMC_USERNAME }}
          SMC_PASSWORD: ${{ secrets.SMC_PASSWORD }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          EXACT_DATE="${{ github.event.inputs.exact_date }}"
          OFFSET="${{ github.event.inputs.date_offset_days || '15' }}"

          if [ -n "$EXACT_DATE" ]; then
            ARGS="--date $EXACT_DATE"
          else
            ARGS="--date-offset-days $OFFSET"
          fi

          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            ARGS="$ARGS --dry-run"
          fi

          echo "Running: python daily_sync.py $ARGS"
          python daily_sync.py $ARGS

      # -----------------------------------------------------------------
      # New job E: freshly-issued decrees, for TODAY (not offset).
      # Needs the second SMC account for the hospital-wide list step.
      # Skipped during a backfill run (see backfill step below instead).
      # -----------------------------------------------------------------
      - name: Run hospital decrees sync (today's freshly-issued decrees)
        if: ${{ github.event.inputs.backfill_start_date == '' }}
        env:
          SMC_USERNAME: ${{ secrets.SMC_USERNAME }}
          SMC_PASSWORD: ${{ secrets.SMC_PASSWORD }}
          SMC_USERNAME_2: ${{ secrets.SMC_USERNAME_2 }}
          SMC_PASSWORD_2: ${{ secrets.SMC_PASSWORD_2 }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          ARGS=""
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            ARGS="--dry-run"
          fi
          echo "Running: python hospital_decrees_sync.py $ARGS"
          python hospital_decrees_sync.py $ARGS

      - name: Promote/normalize hospital decrees into decree_issued_decrees
        if: ${{ github.event.inputs.backfill_start_date == '' && github.event.inputs.dry_run != 'true' }}
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          echo "Running: python promote_hospital_decrees.py"
          python promote_hospital_decrees.py

      # -----------------------------------------------------------------
      # New job F: decree request STATUS, refreshed for a rolling window
      # (default last 15 days, not just today -- see the LOOKBACK_DAYS
      # note in request_status_sync.py for why a single-day query used
      # to leave every request's status frozen at its creation-day value
      # forever). Same second SMC account, single session.
      # Skipped during a backfill run (see backfill step below instead).
      # -----------------------------------------------------------------
      - name: Run request status sync (refresh last N days of requests)
        if: ${{ github.event.inputs.backfill_start_date == '' }}
        env:
          SMC_USERNAME_2: ${{ secrets.SMC_USERNAME_2 }}
          SMC_PASSWORD_2: ${{ secrets.SMC_PASSWORD_2 }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          LOOKBACK="${{ github.event.inputs.request_status_lookback_days || '15' }}"
          ADMIN_LETTER_LOOKBACK="${{ github.event.inputs.admin_letter_lookback_days || '10' }}"
          ARGS="--lookback-days $LOOKBACK --admin-letter-lookback-days $ADMIN_LETTER_LOOKBACK"
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            ARGS="$ARGS --dry-run"
          fi
          echo "Running: python request_status_sync.py $ARGS"
          python request_status_sync.py $ARGS

      - name: Normalize request descriptions against request_name_map
        if: ${{ github.event.inputs.backfill_start_date == '' && github.event.inputs.dry_run != 'true' }}
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          echo "Running: python promote_request_status.py"
          python promote_request_status.py

      # -----------------------------------------------------------------
      # ONE-TIME BACKFILL MODE
      # Only runs when backfill_start_date is set via workflow_dispatch.
      # Loops day-by-day over [backfill_start_date, backfill_end_date],
      # running hospital_decrees_sync.py and request_status_sync.py for
      # each real calendar day (both scripts already accept --date), then
      # runs the two promote scripts ONCE at the end over the whole batch.
      # Always writes to Supabase for real -- dry_run is ignored here on
      # purpose, since a dry-run backfill defeats the point; if you want
      # to sanity-check first, backfill a single day (start == end) and
      # check the tables before doing the full range.
      # -----------------------------------------------------------------
      - name: Backfill hospital decrees + requests for a date range
        if: ${{ github.event.inputs.backfill_start_date != '' }}
        env:
          SMC_USERNAME: ${{ secrets.SMC_USERNAME }}
          SMC_PASSWORD: ${{ secrets.SMC_PASSWORD }}
          SMC_USERNAME_2: ${{ secrets.SMC_USERNAME_2 }}
          SMC_PASSWORD_2: ${{ secrets.SMC_PASSWORD_2 }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          START="${{ github.event.inputs.backfill_start_date }}"
          END="${{ github.event.inputs.backfill_end_date }}"

          if [ -z "$END" ]; then
            echo "backfill_end_date is required when backfill_start_date is set." >&2
            exit 1
          fi

          d="$START"
          end_epoch=$(date -d "$END" +%s)

          while [ "$(date -d "$d" +%s)" -le "$end_epoch" ]; do
            echo "=================================================="
            echo "Backfilling $d"
            echo "=================================================="
            echo "Running: python hospital_decrees_sync.py --date $d"
            python hospital_decrees_sync.py --date "$d"

            echo "Running: python request_status_sync.py --date $d"
            python request_status_sync.py --date "$d"

            d=$(date -d "$d + 1 day" +%Y-%m-%d)
          done

          echo "=================================================="
          echo "Promoting the full backfilled batch"
          echo "=================================================="
          echo "Running: python promote_hospital_decrees.py"
          python promote_hospital_decrees.py

          echo "Running: python promote_request_status.py"
          python promote_request_status.py

      - name: Upload dry-run output
        if: ${{ github.event.inputs.backfill_start_date == '' && github.event.inputs.dry_run == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: dry-run-output
          # All three scripts default to ./dry_run_output and write
          # differently-named CSVs there (queue_data.csv, issued_decrees.csv,
          # hospital_decrees.csv, request_status.csv, ...) so one shared
          # folder is fine — no filename collisions.
          path: dry_run_output/
