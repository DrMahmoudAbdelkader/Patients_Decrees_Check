name: Decree Value Left - Daily Coverage Scan

# Runs once a day, well before the next day's clinics open, so
# tomorrow's daycare/pharmacy patients are already flagged by the time
# staff start their shift. Adjust the cron time (UTC!) to whatever
# lead time you want before Cairo morning hours.
#
# All scripts live at the repo root (no repo_scripts/ subfolder), so
# these steps run directly from the checkout with no working-directory.
#
# request_id is optional and only present when triggered from the app
# (via the trigger-daily-scan Edge Function) -- cron and plain manual
# "Run workflow" clicks leave it blank, and queue_value_left_scan.py
# simply skips all decree_daily_scan_runs tracking in that case.
on:
  schedule:
    - cron: "0 3 * * *"   # 03:00 UTC = 05:00/06:00 Cairo depending on DST
  workflow_dispatch:
    inputs:
      date:
        description: "Optional exact date to scan (YYYY-MM-DD). Leave blank for 'tomorrow'."
        required: false
      request_id:
        description: "decree_daily_scan_runs.id (uuid) -- set automatically when triggered from the app. Leave blank otherwise."
        required: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run daily scan
        env:
          SMC_USERNAME: ${{ secrets.SMC_USERNAME }}
          SMC_PASSWORD: ${{ secrets.SMC_PASSWORD }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          ARGS=""
          if [ -n "${{ github.event.inputs.date }}" ]; then
            ARGS="$ARGS --date ${{ github.event.inputs.date }}"
          fi
          if [ -n "${{ github.event.inputs.request_id }}" ]; then
            ARGS="$ARGS --request-id ${{ github.event.inputs.request_id }}"
          fi
          python queue_value_left_scan.py $ARGS
